name: Auto-merge Claude PRs

on:
  # Trigger after CI completes on a PR
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    # Only run if CI succeeded and the PR branch starts with claude/
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'claude/')
    runs-on: ubuntu-latest
    steps:
      - name: Find PR for this branch
        id: find-pr
        run: |
          PR=$(gh pr list \
            --repo "${{ github.repository }}" \
            --head "${{ github.event.workflow_run.head_branch }}" \
            --state open \
            --json number \
            --jq '.[0].number')
          echo "pr_number=$PR" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Squash-merge PR
        if: steps.find-pr.outputs.pr_number
        run: |
          gh pr merge ${{ steps.find-pr.outputs.pr_number }} \
            --repo "${{ github.repository }}" \
            --squash \
            --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
